name: Julia

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-gnu, aarch64-linux-gnu, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-w64-mingw32]
    env:
      BINARYBUILDER_AUTOMATIC_APPLE: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Install the pinned build environment
        run: julia --project=julia/build -e 'using Pkg; Pkg.instantiate()'
      - name: Build a clean source snapshot
        shell: bash
        run: |
          mkdir -p build/julia-source
          git archive HEAD | tar -x -C build/julia-source
          export LWBGT_SOURCE_DIR="$PWD/build/julia-source"
          julia --project=julia/build julia/build/build_tarballs.jl '${{ matrix.target }}' --verbose
      - uses: actions/upload-artifact@v7
        with:
          name: julia-products-${{ matrix.target }}
          path: products/lwbgt.v*.tar.gz
          if-no-files-found: error

  prepare:
    name: Prepare release archives and metadata
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: actions/download-artifact@v8
        with:
          pattern: julia-products-*
          path: products
          merge-multiple: true
      - run: julia julia/build/artifacts.jl prepare products native
      - run: julia julia/test/packaging.jl
      - run: python3 tests/test_julia_metadata.py
      - name: Verify generated archives
        run: julia -e 'include("julia/build/artifacts.jl"); verify("native", "native/Artifacts.toml", "native/native-build.toml")'
      - uses: actions/upload-artifact@v7
        with:
          name: julia-native
          path: native/*
          retention-days: 90
          if-no-files-found: error

  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.platform.target }}
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
        platform:
          - {runner: ubuntu-24.04, target: x86_64-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-linux-gnu}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
          - {runner: macos-15, target: aarch64-apple-darwin}
          - {runner: windows-2025, target: x86_64-w64-mingw32}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: actions/download-artifact@v8
        with:
          name: julia-native
          path: native
      - uses: actions/download-artifact@v8
        with:
          name: julia-products-${{ matrix.platform.target }}
          path: products
      - name: Compare native oracle and test isolated Julia package
        run: python tests/check_julia_native.py products native '${{ matrix.platform.target }}'

  commit-metadata:
    name: Append tested metadata to this PR
    needs: test
    # Approval changes triggering_actor, but actor stays github-actions[bot].
    # Approved bot-commit checks must not append another metadata commit.
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: actions/download-artifact@v8
        with:
          name: julia-native
          path: ${{ runner.temp }}/julia-native
      - name: Check other CI results and append only the generated files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          NATIVE_ARCHIVES: ${{ runner.temp }}/julia-native
        run: python3 julia/build/commit_metadata.py "$NATIVE_ARCHIVES"
