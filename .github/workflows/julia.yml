name: Prepare Julia release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Check release preparation prerequisites
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 tests/test_julia_metadata.py
      - id: preflight
        run: python3 julia/build/preparation.py preflight

  checks:
    needs: preflight
    uses: ./.github/workflows/julia-checks.yml

  release-pr:
    name: Open release metadata PR
    needs: [preflight, checks]
    runs-on: ubuntu-24.04
    concurrency:
      group: julia-release-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: actions/download-artifact@v8
        with:
          name: julia-native
          path: ${{ runner.temp }}/julia-native
      - name: Verify and copy the prepared metadata
        env:
          NATIVE_ARCHIVES: ${{ runner.temp }}/julia-native
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          julia -e 'include("julia/build/artifacts.jl"); d=ARGS[1]; verify(d, joinpath(d,"Artifacts.toml"), joinpath(d,"native-build.toml"))' "$NATIVE_ARCHIVES"
          cp "$NATIVE_ARCHIVES/Artifacts.toml" julia/Artifacts.toml
          cp "$NATIVE_ARCHIVES/native-build.toml" julia/native-build.toml
      - name: Open or update the release PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          base: main
          branch: codex/julia-release-v${{ needs.preflight.outputs.version }}
          add-paths: |
            julia/Artifacts.toml
            julia/native-build.toml
          commit-message: 'build(julia): prepare v${{ needs.preflight.outputs.version }} artifacts'
          title: 'Release v${{ needs.preflight.outputs.version }}: pin native artifacts'
          body: |
            Pin the exact native archives tested by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} for source `${{ github.sha }}`.

            Wait for that preparation run to finish successfully, then manually run Validate on this PR branch with "Prepared Julia artifacts" selected. It verifies source and archive hashes and tests installation without rebuilding or writing commits.

            Review and merge manually, then tag the merged commit. If main changes beyond these two metadata files, prepare again. The archives expire after 90 days. This PR does not publish a release.
      - name: Report the release PR
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          echo "Release metadata PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
