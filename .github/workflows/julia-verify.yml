name: Verify prepared Julia artifacts

on:
  workflow_call:
    inputs:
      upload-release:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # For PRs, verify the prospective merge tree, including current base changes.
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Require a successful manual preparation of this source
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 julia/build/preparation.py check-run
      - uses: actions/download-artifact@v8
        with:
          name: julia-native
          path: native
          run-id: ${{ steps.prepared.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify source and exact archive identities
        run: |
          cmp native/Artifacts.toml julia/Artifacts.toml
          cmp native/native-build.toml julia/native-build.toml
          julia julia/build/artifacts.jl verify native
      - name: Test installation from the prepared archive
        run: python3 tests/check_julia_artifact.py native
      - uses: actions/upload-artifact@v7
        if: inputs.upload-release
        with:
          name: julia-native-release
          path: native/*.tar.gz
          if-no-files-found: error
