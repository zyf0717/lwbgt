name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-15-intel
            cc: clang
          - os: windows-latest
            cc: gcc
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Check version coherence
        run: python tests/check_versions.py
      - name: Provision standalone MinGW GCC
        if: runner.os == 'Windows'
        id: mingw
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64
          version: 12.2.0
      - name: Select MinGW compilers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CC=${{ steps.mingw.outputs.gcc }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=${{ steps.mingw.outputs.gxx }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test SwiftPM consumer
        if: runner.os == 'macOS'
        run: |
          build/lwbgt_probe build/cases.csv > build/swift-expected.csv
          LWBGT_CASES="$PWD/build/cases.csv" \
          LWBGT_EXPECTED="$PWD/build/swift-expected.csv" \
          swift test --package-path tests/swiftpm -c release -Xcc -march=native

  swiftpm-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build native numerical comparison
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target lwbgt_probe --parallel
          python3 tests/generate_cases.py build/cases.csv
          build/lwbgt_probe build/cases.csv > build/swift-expected.csv
      - name: Test SwiftPM consumer
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          --workdir /workspace
          --env LWBGT_CASES=/workspace/build/cases.csv
          --env LWBGT_EXPECTED=/workspace/build/swift-expected.csv
          swift:6.2.4-noble
          swift test --package-path tests/swiftpm -c release -Xcc -march=native
