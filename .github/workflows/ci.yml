name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: macos-15-intel
            cc: clang
          - os: windows-latest
            cc: gcc
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Check version coherence
        run: python tests/check_versions.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          windows-path-include-mingw: true
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLWBGT_REQUIRE_ALL_BINDING_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test SwiftPM consumer
        if: runner.os == 'macOS'
        run: swift test --package-path tests/swiftpm -c release

  swiftpm-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Test SwiftPM consumer
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          --workdir /workspace
          swift:6.2.4-noble
          swift test --package-path tests/swiftpm -c release
