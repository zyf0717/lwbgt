name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-tag:
    name: Verify annotated release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require an annotated tag object
        run: test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag

  artifacts:
    needs: release-tag
    uses: ./.github/workflows/wheels.yml

  r-artifact:
    needs: release-tag
    uses: ./.github/workflows/r.yml

  native-artifacts:
    name: Verify prepared Julia binaries
    needs: release-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Read the preparation run
        id: prepared
        run: |
          julia -e '
            using TOML
            m = TOML.parsefile("julia/native-build.toml")
            occursin(r"^[0-9]+$", m["run_id"]) || error("invalid run ID")
            occursin(r"^[0-9a-f]{40}$", m["source_commit"]) || error("invalid source commit")
            open(ENV["GITHUB_OUTPUT"], "a") do io
              println(io, "run_id=", m["run_id"])
              println(io, "source_commit=", m["source_commit"])
            end'
      - name: Require a successful preparation run from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN: ${{ steps.prepared.outputs.run_id }}
          PREPARED_COMMIT: ${{ steps.prepared.outputs.source_commit }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$PREPARED_RUN"
          test "$(gh api "$endpoint" --jq '.conclusion == "success" and (.event == "workflow_dispatch" or .event == "pull_request") and .path == ".github/workflows/julia.yml"')" = true
          test "$(gh api "$endpoint" --jq '.head_sha')" = "$PREPARED_COMMIT"
          test "$(gh api "$endpoint" --jq '.head_repository.full_name')" = "$GITHUB_REPOSITORY"
      - uses: actions/download-artifact@v8
        with:
          name: julia-native
          path: native
          run-id: ${{ steps.prepared.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify source and exact archive identities
        run: |
          cmp native/Artifacts.toml julia/Artifacts.toml
          cmp native/native-build.toml julia/native-build.toml
          julia julia/build/artifacts.jl verify native
      - uses: actions/upload-artifact@v7
        with:
          name: julia-native-release
          path: native/*.tar.gz
          if-no-files-found: error

  testpypi-publish:
    name: Publish verified artifacts to TestPyPI
    needs: [artifacts, r-artifact, native-artifacts]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/lwbgt/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Require the complete release matrix
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 5
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
      - name: Publish through TestPyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke:
    name: Verify TestPyPI artifact identity and installation
    needs: testpypi-publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Download the release wheel from TestPyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir testpypi
          for attempt in $(seq 1 12); do
            if python -m pip download \
              --index-url https://test.pypi.org/simple/ \
              --only-binary=:all: --no-cache-dir --no-deps \
              --dest testpypi "lwbgt==$version"; then
              break
            fi
            if test "$attempt" -eq 12; then
              exit 1
            fi
            sleep 10
          done
      - name: Match the complete tested artifact set byte-for-byte
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from urllib.request import urlopen

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir()
              if path.is_file()
          }
          release_url = f"https://test.pypi.org/pypi/lwbgt/{version}/json"
          published = {}
          for attempt in range(12):
              try:
                  with urlopen(release_url) as response:
                      release = json.load(response)
                  published = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in release["urls"]
                  }
              except OSError:
                  published = {}
              if published == expected:
                  break
              if attempt != 11:
                  time.sleep(10)
          else:
              raise SystemExit(
                  f"TestPyPI release differs: published={published}, expected={expected}"
              )

          downloaded = list(Path("testpypi").glob("*.whl"))
          if len(downloaded) != 1:
              raise SystemExit(f"expected one TestPyPI wheel, got {downloaded}")
          expected_wheel = Path("dist", downloaded[0].name)
          if not expected_wheel.is_file():
              raise SystemExit(f"TestPyPI returned an unexpected artifact: {downloaded[0].name}")
          actual_hash = hashlib.sha256(downloaded[0].read_bytes()).hexdigest()
          expected_hash = hashlib.sha256(expected_wheel.read_bytes()).hexdigest()
          if actual_hash != expected_hash:
              raise SystemExit(
                  f"TestPyPI artifact hash mismatch: {actual_hash} != {expected_hash}"
              )
          print(f"TestPyPI release identity: {len(expected)} artifacts: ok")
          print(f"TestPyPI wheel download: {downloaded[0].name}: {actual_hash}")
          PY
      - name: Test the wheel retrieved from TestPyPI
        run: |
          python -m venv testpypi-test
          testpypi-test/bin/python -m pip install --no-index testpypi/*.whl
          testpypi-test/bin/python -m unittest discover -s tests/python -v

  publish:
    name: Publish verified artifacts to PyPI
    needs: [artifacts, testpypi-smoke]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/lwbgt
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Require the complete release matrix
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 5
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: [publish, r-artifact, native-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: r-source
          path: r-dist
      - uses: actions/download-artifact@v8
        with:
          name: julia-native-release
          path: native
      - name: Create release for the existing annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* r-dist/* native/* --verify-tag --generate-notes

  julia-install:
    name: Verify published Julia installation
    needs: github-release
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install and test the tagged subdirectory in a clean environment
        shell: bash
        env:
          JULIA_DEPOT_PATH: ${{ runner.temp }}/julia-release-depot
        run: |
          julia -e 'using Pkg;
            Pkg.activate(mktempdir());
            Pkg.add(PackageSpec(url="https://github.com/zyf0717/lwbgt.git", rev=ENV["GITHUB_REF_NAME"], subdir="julia"));
            Pkg.test("LWBGT")'
